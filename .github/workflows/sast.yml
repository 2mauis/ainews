name: sast
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: node scripts/fetch-pkauth.mjs
      - run: pip install "semgrep==1.183.0"
      # src/index.js 是线上导出的打包产物（基线），不在本仓直接维护，排除；新增代码全部扫描。
      - name: semgrep（社区规则 + 本仓规则，只在本地运行，不上传结果）
        run: semgrep scan --metrics=off --error --config p/javascript --config p/nodejsscan --config p/secrets --config p/github-actions --config .semgrep.yml --exclude src/index.js src scripts tests .github vendor/pkauth-core/src vendor/pkauth-workers/src
